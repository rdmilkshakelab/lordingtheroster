<style>

*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -20%,#302044 0,transparent 42%),var(--bg);color:var(--text);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:12px 0 24px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px}.mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(140deg,var(--pink),#785bdb);display:grid;place-items:center;font-size:23px;font-weight:900;box-shadow:0 8px 30px #f15ca833}.brand h1{font-size:18px;letter-spacing:.11em;margin:0}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.16em;margin-top:3px}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button,.btn{border:1px solid var(--line);color:var(--text);background:var(--panel);padding:10px 14px;border-radius:12px}.nav button.active,.btn.primary{background:linear-gradient(120deg,#a74d9a,#6956bc);border-color:transparent}.btn.subtle{background:transparent}.btn.danger{color:var(--red)}.nav button:hover,.btn:hover{border-color:var(--purple)}main{padding:26px 0 55px}.eyebrow{color:var(--pink);font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.herohead{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:8px 0 22px}.herohead h2{font-size:clamp(30px,5vw,52px);letter-spacing:-.045em;line-height:1.03;margin:8px 0}.herohead p{color:var(--muted);margin:0;max-width:600px;line-height:1.6}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin:22px 0}.panel,.stat{background:linear-gradient(145deg,#191923,#13131b);border:1px solid var(--line);border-radius:var(--radius);padding:19px}.stat span{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:30px;margin-top:8px;letter-spacing:-.04em}.stat em{font-style:normal;color:var(--green);font-size:11px}.progress{height:9px;background:#292938;border-radius:99px;overflow:hidden;margin:14px 0 7px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--purple));border-radius:99px;transition:width .3s}.columns{grid-template-columns:1.2fr .8fr}.panel h3{margin:0 0 14px;font-size:17px}.muted{color:var(--muted)}.current{display:flex;align-items:center;justify-content:space-between;gap:14px}.current h4{font-size:25px;margin:5px 0}.pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;padding:5px 9px;color:var(--muted);font-size:11px}.pill.done{color:var(--green);border-color:#326d57}.pill.live{color:var(--pink);border-color:#74375b}.sectionbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:18px 0}.sectionbar h3{margin:0;font-size:22px}.controls{display:flex;gap:8px;flex-wrap:wrap}.field{background:#101018;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;min-width:0}.field:focus{outline:2px solid #a58bff66;border-color:var(--purple)}.controls .field{min-width:145px}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.hero-card{background:linear-gradient(145deg,#1a1a25,#12121a);border:1px solid var(--line);border-radius:15px;padding:15px;display:flex;flex-direction:column;gap:11px;min-width:0}.hero-card:hover{border-color:#66538f}.hero-card-top{display:flex;align-items:start;justify-content:space-between;gap:8px}.hero-card h4{margin:0;font-size:16px}.role{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}.hero-card .mini{font-size:11px;color:var(--muted)}.hero-card .progress{margin:0;height:6px}.hero-card-foot{display:flex;align-items:center;justify-content:space-between;gap:6px}.smallbtn{border:1px solid var(--line);background:#20202b;color:var(--text);border-radius:9px;padding:7px 10px;font-size:11px}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.suggestion-list{display:grid;gap:10px}.suggestion{border:1px solid var(--line);border-radius:13px;padding:13px;background:#12121a;display:flex;align-items:center;justify-content:space-between;gap:12px}.suggestion h4{margin:0 0 4px}.vote{display:flex;align-items:center;gap:8px}.vote button{border:1px solid var(--line);background:#242433;color:var(--text);border-radius:10px;padding:8px 11px}.vote button.voted{color:var(--pink);border-color:var(--pink)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid .wide{grid-column:1/-1}label{display:grid;gap:6px;font-size:12px;color:var(--muted)}textarea.field{resize:vertical;min-height:90px}.hidden{display:none!important}.notice{border:1px solid #6d5b9d;background:#211b31;padding:12px 14px;border-radius:12px;color:#d9d0f5;font-size:13px;line-height:1.5}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#29243a;border:1px solid #65528c;padding:12px 18px;border-radius:12px;z-index:20;box-shadow:0 10px 35px #0008}.footer{border-top:1px solid var(--line);padding:20px 0;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.footer a{color:#c3b5ff}.modal-back{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:10}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#171721;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 25px 80px #000b}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h3{margin:0}.x{background:none;border:0;color:var(--muted);font-size:24px}.barline{height:1px;background:var(--line);margin:15px 0}.hiddenfile{display:none}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.herohead{align-items:start;flex-direction:column}.top{align-items:flex-start;flex-direction:column}.nav{width:100%}.nav button{flex:1}}

/* Refined editorial interface */
:root{color-scheme:dark;--bg:#0b1016;--panel:#121a23;--panel2:#182330;--line:#283543;--text:#edf2f6;--muted:#9aa8b5;--pink:#e15b68;--purple:#e15b68;--green:#69c6a0;--gold:#d7b36a;--red:#ef777e;--radius:12px;font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif}
body{background:var(--bg);background-image:linear-gradient(180deg,#111b25 0,#0b1016 420px);letter-spacing:.005em}
.wrap{max-width:1240px;padding:26px 30px}.top{padding:14px 0 22px;border-bottom:1px solid #293541}
.mark{width:40px;height:40px;border-radius:9px;background:#e15b68;box-shadow:none;color:#fff}
.brand h1{font-size:15px;letter-spacing:.14em;font-weight:750}.brand small{font-size:10px;letter-spacing:.19em}

.nav button.active,.btn.primary{background:#d94f5e;border-color:#d94f5e;color:#fff}
.nav button:hover,.btn:hover{border-color:#e15b68;transform:translateY(-1px)}
main{padding:34px 0 64px}.eyebrow{color:#e87983;font-size:10px;letter-spacing:.16em}
.herohead{margin:8px 0 28px}.herohead h2{font-size:clamp(34px,4.8vw,54px);font-weight:720;letter-spacing:-.055em;line-height:1.02}
.herohead p{font-size:14px;max-width:620px;color:#aab6c1}.grid{gap:16px}.stats{margin:26px 0}
.panel,.stat,.hero-card{background:#121a23;border:1px solid #293744;border-radius:11px;box-shadow:0 8px 24px #00000012}
.panel,.stat{padding:21px}.stat span{font-size:10px;letter-spacing:.11em;font-weight:700}.stat strong{font-size:32px;font-weight:700}

.pill{border-radius:6px;padding:5px 8px;font-weight:650;letter-spacing:.02em}.pill.done{color:#8fd4b4;border-color:#315a4a;background:#172a25}
.pill.live{color:#f08b94;border-color:#70404a;background:#2a1b21}

.hero-card{padding:16px;gap:12px;transition:border-color .16s,transform .16s}.hero-card:hover{border-color:#637484;transform:translateY(-2px)}
.hero-card h4{font-size:15px;font-weight:680}.role{font-size:9px;letter-spacing:.14em}
.smallbtn{border-radius:7px;background:#1b2732;border-color:#354451}
.suggestion{background:#111a23;border-color:#2b3945;border-radius:10px;padding:15px}.vote button{background:#1b2732;border-radius:8px}
.vote button.voted{color:#f08b94;border-color:#e15b68}.empty{border-color:#354451;border-radius:10px}

.modal{background:#121a23;border-color:#344351;border-radius:14px}.footer{border-color:#293744;font-size:11px}.footer a{color:#e58b93}

.settings-block>div:first-child{max-width:460px}.settings-block h3{margin-bottom:6px}.settings-block p{margin:0;line-height:1.55;font-size:13px}

.secret-wrap span{font-size:11px;color:var(--muted);font-weight:650}.secret-wrap code{overflow-wrap:anywhere;color:#f3f5f7;letter-spacing:.08em}
#totpVerify{align-items:center}#totpVerify .field{max-width:180px;letter-spacing:.18em;text-align:center}
@media(max-width:800px){.wrap{padding:18px}.settings-block{align-items:flex-start;flex-direction:column}.settings-block>label,.admin-panel{width:100%}}
@media(max-width:520px){.wrap{padding:14px}.top{gap:14px}.nav button{padding:9px 8px;font-size:12px}.herohead h2{font-size:38px}.panel,.stat{padding:16px}.settings-block{gap:12px}.qr-frame{width:100%;max-width:240px}}

<body><div class="wrap">
<header class="top"><div class="brand"><div class="mark">L</div><div><h1>LORDING THE ROSTER</h1><small>ONE HERO AT A TIME.</small></div></div>
<nav class="nav" aria-label="Main navigation"><button class="active" data-page="home">Overview</button><button data-page="heroes">Hero tracker</button><button data-page="community">Community</button><button data-page="settings">Settings</button></nav></header>
<main id="app"></main>
<footer class="footer"><span>Fan-made challenge tracker. Not affiliated with Marvel, NetEase or Marvel Rivals.</span><span><a href="https://github.com/rdmilkshakelab/lordingtheroster" target="_blank" rel="noreferrer">Source on GitHub</a> · Progress is saved in this browser.</span></footer>
</div><div id="modalroot"></div><div id="toastroot" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const ROSTER=[
["Adam Warlock","Strategist"],["Angela","Vanguard"],["Black Cat","Duelist"],["Black Panther","Duelist"],["Black Widow","Duelist"],["Blade","Duelist"],["Captain America","Vanguard"],["Cloak & Dagger","Strategist"],["Cyclops","Duelist"],["Daredevil","Duelist"],["Deadpool","Vanguard / Duelist / Strategist"],["Devil Dinosaur","Vanguard"],["Doctor Strange","Vanguard"],["Elsa Bloodstone","Duelist"],["Emma Frost","Vanguard"],["Gambit","Strategist"],["Gorr the God Butcher","Duelist"],["Groot","Vanguard"],["Hawkeye","Duelist"],["Hela","Duelist"],["Hulk","Vanguard"],["Human Torch","Duelist"],["Invisible Woman","Strategist"],["Iron Fist","Duelist"],["Iron Man","Duelist"],["Jeff the Land Shark","Strategist"],["Jubilee","Strategist"],["Loki","Strategist"],["Luna Snow","Strategist"],["Magik","Duelist"],["Magneto","Vanguard"],["Mantis","Strategist"],["Mister Fantastic","Duelist"],["Moon Knight","Duelist"],["Namor","Duelist"],["Peni Parker","Vanguard"],["Phoenix","Duelist"],["Psylocke","Duelist"],["Rocket Raccoon","Strategist"],["Rogue","Vanguard"],["Scarlet Witch","Duelist"],["Spider-Man","Duelist"],["Squirrel Girl","Duelist"],["Star-Lord","Duelist"],["Storm","Duelist"],["The Hood","Vanguard"],["The Punisher","Duelist"],["The Thing","Vanguard"],["Thor","Vanguard"],["Ultron","Strategist"],["Venom","Vanguard"],["White Fox","Strategist"],["Winter Soldier","Duelist"],["Wolverine","Duelist"]
];
const PUBLIC_SUPABASE_CONFIG={url:"https://yqvmqhxqgldnrghjzswm.supabase.co",key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlxdm1xaHhxZ2xkbnJnaGp6c3dtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5ODEyMDEsImV4cCI6MjEwOTU1NzIwMX0.pclUJkMrEdXLKcfgBrFicX2s5xGYCbPtUBcE2iyH3Wc"}; // Optional: set the public project URL and anon key here for all visitors. Never use service_role.
const KEY="lording-roster-v1";
const defaults=()=>{const data=Object.fromEntries(ROSTER.map(([name,role])=>[name,{role,status:"Not started",level:0,episode:"",url:"",notes:""}]));data["Winter Soldier"].status="Lord";data["Spider-Man"].status="Lord";data["Psylocke"].status="In Progress";data["Psylocke"].level=7;data["Captain America"].status="In Progress";return data};
let state=load();let page="home";let filter="All";let search="";let supa={url:"",key:""};let sb=null,adminSession=null,adminReady=false,totpFactorId=null,totpChallengeId=null;let voteId=localStorage.getItem("ltr-voter")||crypto.randomUUID();localStorage.setItem("ltr-voter",voteId);
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||"{}");return {heroes:{...defaults(),...(s.heroes||{})},current:s.current||"Psylocke",episodes:s.episodes||[],suggestions:s.suggestions||[],config:{...PUBLIC_SUPABASE_CONFIG,...(s.config||{})}}}catch{return {heroes:defaults(),current:"Psylocke",episodes:[],suggestions:[],config:{}}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(s){const r=document.getElementById("toastroot");r.innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>r.innerHTML="",2600)}
function done(){return Object.values(state.heroes).filter(h=>h.status==="Lord").length}
function pct(){return Math.round(done()/ROSTER.length*100)}
function pageNav(p){page=p;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render()}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>pageNav(b.dataset.page)));
function render(){const app=document.getElementById("app");if(page==="home")app.innerHTML=home();if(page==="heroes")app.innerHTML=heroesPage();if(page==="community")app.innerHTML=communityPage();if(page==="settings")app.innerHTML=settingsPage();wire()}
function home(){const remaining=ROSTER.length-done(),h=state.heroes[state.current]||{};const recent=ROSTER.filter(([n])=>state.heroes[n].status==="Lord").slice(-4).reverse();return `
<div class="herohead"><div><div class="eyebrow">THE LONG GAME</div><h2>Lord the entire<br>roster.</h2><p>Track each hero’s progress, follow the episodes, and let the community choose what comes next.</p></div><button class="btn primary" data-action="random">Pick my next hero ↗</button></div>
<div class="grid stats"><div class="stat"><span>ROSTER COMPLETION</span><strong>${pct()}%</strong><div class="progress"><i style="width:${pct()}%"></i></div><em>${done()} of ${ROSTER.length} heroes Lorded</em></div><div class="stat"><span>LORD COUNT</span><strong>${done()}</strong><em>Heroes at Lord</em></div><div class="stat"><span>STILL TO GO</span><strong>${remaining()}</strong><em>Heroes remaining</em></div><div class="stat"><span>EPISODES LOGGED</span><strong>${ROSTER.filter(([n])=>state.heroes[n].url).length}</strong><em>Videos linked to heroes</em></div></div>
<div class="grid columns"><section class="panel"><div class="eyebrow">CURRENT CHALLENGE</div><div class="current"><div><h4>${esc(state.current)}</h4><div class="muted">${esc(h.role||"Choose a hero")} · ${esc(h.status||"Not started")}</div><p class="muted">Level / proficiency: ${h.level||0}</p></div><button class="btn" data-edit="${esc(state.current)}">Update progress</button></div><div class="progress"><i style="width:${h.status==="Lord"?100:Math.min(99,(h.level||0)/15*100)}%"></i></div><div class="muted" style="font-size:12px">Your active challenge.</div></section>
<section class="panel"><h3>Community's next pick</h3><div id="topvote"><div class="muted">Loading suggestions…</div></div><button class="btn subtle" data-goto="community" style="margin-top:12px">See all suggestions →</button></section></div>
<div class="sectionbar"><h3>Recent Lords</h3><button class="btn subtle" data-goto="heroes">Open full tracker →</button></div>
<div class="grid cards">${recent.length?recent.map(([n,r])=>heroCard(n,r)).join(""):'<div class="empty">Your first Lord awaits. Time to start climbing.</div>'}</div>
`}
function heroCard(name,role){const h=state.heroes[name];return `<article class="hero-card"><div class="hero-card-top"><div><h4>${esc(name)}</h4><div class="role">${esc(role||h.role)}</div></div><span class="pill ${h.status==="Lord"?"done":""}">${esc(h.status)}</span></div><div class="mini">Level / proficiency: ${h.level||0}</div><div class="progress"><i style="width:${h.status==="Lord"?100:Math.min(99,(h.level||0)/15*100)}%"></i></div><div class="hero-card-foot"><span class="mini">${h.url?"Episode linked":"No episode linked"}</span><button class="smallbtn" data-edit="${esc(name)}">Edit</button></div></article>`}
function heroesPage(){const list=ROSTER.filter(([n,r])=>(filter==="All"||filter==="Lorded"&&state.heroes[n].status==="Lord"||filter==="Remaining"&&state.heroes[n].status!=="Lord"||r.split(" / ").includes(filter))&&n.toLowerCase().includes(search.toLowerCase()));return `<div class="herohead"><div><div class="eyebrow">THE COMPLETE LINE-UP</div><h2>Hero tracker</h2><p>Track proficiency, notes and episode links for every hero. Deadpool appears once, with all three roles noted.</p></div></div><div class="sectionbar"><h3>${list.length} heroes</h3><div class="controls"><input class="field" id="heroSearch" placeholder="Search heroes…" value="${esc(search)}"><select class="field" id="heroFilter"><option>All</option><option ${filter==="Duelist"?"selected":""}>Duelist</option><option ${filter==="Vanguard"?"selected":""}>Vanguard</option><option ${filter==="Strategist"?"selected":""}>Strategist</option><option ${filter==="Lorded"?"selected":""}>Lorded</option><option ${filter==="Remaining"?"selected":""}>Remaining</option></select></div></div><div class="grid cards">${list.map(([n,r])=>heroCard(n,r)).join("")||'<div class="empty">No heroes match that search.</div>'}</div>`}
function communityPage(){const cfg=state.config;return `<div class="herohead"><div><div class="eyebrow">THE COMMUNITY CHOOSES</div><h2>Choose the next<br>challenge.</h2><p>Suggest a hero for the next climb, tell me why, and vote for the challenges you want to see.</p></div></div><section class="panel"><h3>Suggest a hero</h3><form id="suggestForm" class="formgrid"><label>Hero<select class="field" name="hero" required>${ROSTER.filter(([n])=>state.heroes[n].status!=="Lord").map(([n])=>'<option>'+esc(n)+'</option>').join("")}</select></label><label>Your name (optional)<input class="field" name="name" maxlength="32" placeholder="Anonymous"></label><label class="wide">Why this hero? (optional)<textarea class="field" name="reason" maxlength="240" placeholder="Why should this hero be next?"></textarea></label><div class="wide"><button class="btn primary" type="submit">Send suggestion</button></div></form></section><div class="sectionbar"><h3>Most requested</h3><span class="pill" id="communityMode">${cfg.url&&cfg.key?"Community board active":"Local preview"}</span></div><div id="suggestions" class="suggestion-list"><div class="empty">Loading suggestions…</div></div><p class="muted" style="font-size:12px;margin-top:14px">Votes are limited to one per hero per browser. Community suggestions and votes are shared with visitors.</p>`}
function settingsPage(){return `<div class="herohead"><div><div class="eyebrow">PREFERENCES</div><h2>Settings</h2><p>Manage your challenge, keep a backup of your progress, and access creator controls.</p></div></div><section class="panel settings-panel"><div class="settings-block"><div><h3>Current challenge</h3><p class="muted">Choose the hero you're currently working towards Lord.</p></div><label>Current hero<select class="field" id="currentHero">${ROSTER.map(([n])=>'<option '+(n===state.current?'selected':'')+'>'+esc(n)+'</option>').join("")}</select></label></div><div class="barline"></div><div class="settings-block"><div><h3>Progress backup</h3><p class="muted">Download a copy of your progress, notes and episode links, or restore a previous backup.</p></div><div class="controls"><button class="btn" data-action="export">Download backup</button><button class="btn subtle" data-action="import">Restore backup</button><input class="hiddenfile" type="file" id="importFile" accept="application/json"></div></div><div class="barline"></div><div class="settings-block"><div><h3>Creator access</h3><p class="muted">Sign in to manage hero progress. A verified authenticator code is required before changes can be published.</p></div><div id="adminPanel" class="admin-panel"></div></div><div class="barline"></div><div class="settings-block"><div><h3>Reset this device</h3><p class="muted">Clear locally saved progress on this device. This cannot be undone.</p></div><button class="btn danger" data-action="reset">Reset local progress</button></div></section>`}
function openEdit(name){if(!adminReady){toast("Admin sign-in and authenticator verification required");pageNav("settings");return}const h=state.heroes[name];document.getElementById("modalroot").innerHTML=`<div class="modal-back" id="backdrop"><section class="modal"><div class="modalhead"><h3>${esc(name)}</h3><button class="x" data-action="close">×</button></div><form id="editForm" data-name="${esc(name)}" class="formgrid"><label>Status<select class="field" name="status"><option ${h.status==="Not started"?"selected":""}>Not started</option><option ${h.status==="In Progress"?"selected":""}>In Progress</option><option ${h.status==="Lord"?"selected":""}>Lord</option></select></label><label>Current level<input class="field" type="number" name="level" min="0" max="100" value="${h.level||0}"></label><label>Episode number<input class="field" name="episode" maxlength="20" value="${esc(h.episode||"")}" placeholder="e.g. 04"></label><label>Video URL<input class="field" name="url" type="url" value="${esc(h.url||"")}" placeholder="https://youtu.be/…"></label><label class="wide">Notes<textarea class="field" name="notes">${esc(h.notes||"")}</textarea></label><div class="wide controls"><button class="btn primary" type="submit">Save hero</button><button class="btn subtle" type="button" data-action="setcurrent" data-name="${esc(name)}">Make current challenge</button></div></form></section></div>`}
function wire(){document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));document.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>pageNav(b.dataset.goto));document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>action(b));const s=document.getElementById("heroSearch");if(s)s.oninput=()=>{search=s.value;const pos=s.selectionStart;render();const n=document.getElementById("heroSearch");n.focus();n.setSelectionRange(pos,pos)};const f=document.getElementById("heroFilter");if(f)f.onchange=()=>{filter=f.value;render()};const c=document.getElementById("currentHero");if(c)c.onchange=()=>{state.current=c.value;save();toast("Current challenge updated");};const e=document.getElementById("editForm");if(e)e.onsubmit=async ev=>{ev.preventDefault();const d=new FormData(e),n=e.dataset.name;state.heroes[n]={...state.heroes[n],status:d.get("status"),level:Number(d.get("level"))||0,episode:d.get("episode"),url:d.get("url"),notes:d.get("notes")};save();if(sb&&adminReady){try{await saveSharedHero(n,state.heroes[n])}catch(err){toast("Saved locally, but cloud update failed: "+err.message);return}}document.getElementById("modalroot").innerHTML="";render();toast("Progress saved")};const sf=document.getElementById("suggestForm");if(sf)sf.onsubmit=async ev=>{ev.preventDefault();const d=new FormData(sf);const item={hero:d.get("hero"),name:d.get("name")||"Anonymous",reason:d.get("reason")||"",votes:0,created_at:new Date().toISOString()};if(state.config.url&&state.config.key){try{await apiInsert(item);toast("Suggestion sent to the community board")}catch(err){toast("Could not send: "+err.message);return}}else{state.suggestions.push({...item,id:crypto.randomUUID(),local:true});save();toast("Suggestion saved in this browser")}render();};wireVotes();loadTop();renderAdminPanel()}
async function action(b){const a=b.dataset.action;if(a==="close")document.getElementById("modalroot").innerHTML="";if(a==="setcurrent"){state.current=b.dataset.name;save();document.getElementById("modalroot").innerHTML="";render();toast("Current challenge updated")}if(a==="random"){const pool=ROSTER.filter(([n])=>state.heroes[n].status!=="Lord");if(pool.length){state.current=pool[Math.floor(Math.random()*pool.length)][0];save();render();toast("Next up: "+state.current)}}if(a==="export"){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),u=URL.createObjectURL(blob),x=document.createElement("a");x.href=u;x.download="lording-the-roster-backup.json";x.click();URL.revokeObjectURL(u)}if(a==="import")document.getElementById("importFile").click();if(a==="connect"){state.config={url:document.getElementById("supaUrl").value.trim().replace(/\/$/,""),key:document.getElementById("supaKey").value.trim()};save();try{await init();await apiGet();toast("Community board connected");pageNav("community")}catch(e){toast("Connection check failed: "+e.message)}}if(a==="disconnect"){state.config={};save();toast("Shared board disconnected");render()}if(a==="reset"&&confirm("Delete all Lording the Roster progress saved on this device?")){localStorage.removeItem(KEY);state=load();render();toast("Local progress reset")}}
document.addEventListener("change",e=>{if(e.target.id==="importFile"&&e.target.files[0]){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.heroes)throw Error();state={...state,...x,heroes:{...defaults(),...x.heroes}};save();render();toast("Backup restored")}catch{toast("That backup file could not be read")}};r.readAsText(e.target.files[0])}});
function headers(){return {"apikey":state.config.key,"Authorization":"Bearer "+state.config.key,"Content-Type":"application/json","Prefer":"return=representation"}}
async function apiGet(){const r=await fetch(state.config.url+"/rest/v1/suggestions?select=*&status=eq.approved&order=votes.desc,created_at.desc",{headers:headers()});if(!r.ok)throw Error(await r.text());return r.json()}
async function initSupabase(){if(!window.supabase||!state.config.url||!state.config.key)throw Error("Creator services are temporarily unavailable. Please try again later.");sb=window.supabase.createClient(state.config.url,state.config.key);const {data}=await sb.auth.getSession();adminSession=data.session;adminReady=false;if(adminSession)await refreshAdminState();await loadSharedHeroes();return sb}
async function refreshAdminState(){adminReady=false;if(!sb||!adminSession)return;const {data,error}=await sb.rpc("ltr_is_admin");if(error)throw error;const {data:aal,error:ae}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();if(ae)throw ae;adminReady=!!data&&aal&&aal.currentLevel==="aal2";return adminReady}
async function loadSharedHeroes(){if(!sb)return;const {data,error}=await sb.from("hero_progress").select("*");if(error){console.warn("Shared hero progress not available",error.message);return}for(const row of data||[]){if(state.heroes[row.hero])state.heroes[row.hero]={...state.heroes[row.hero],status:row.status,level:row.level,episode:row.episode||"",url:row.video_url||"",notes:row.notes||""}}save()}
async function saveSharedHero(name,h){const {error}=await sb.from("hero_progress").upsert({hero:name,status:h.status,level:h.level,episode:h.episode||"",video_url:h.url||"",notes:h.notes||"",updated_at:new Date().toISOString()},{onConflict:"hero"});if(error)throw error}
function renderAdminPanel(){const root=document.getElementById("adminPanel");if(!root)return;if(!state.config.url||!state.config.key){root.innerHTML='<div class="notice">Creator services are unavailable right now. Please try again later.</div>';return}if(!sb){root.innerHTML='<button class="btn" id="adminInit">Open creator sign-in</button>';document.getElementById("adminInit").onclick=async()=>{try{await initSupabase();renderAdminPanel()}catch(e){toast(e.message)}};return}if(!adminSession){root.innerHTML='<form id="adminLogin" class="formgrid"><label>Email<input class="field" type="email" name="email" required autocomplete="username"></label><label>Password<input class="field" type="password" name="password" required autocomplete="current-password"></label><div class="wide"><button class="btn primary">Sign in</button></div></form>';document.getElementById("adminLogin").onsubmit=async e=>{e.preventDefault();const d=new FormData(e.currentTarget);const {data,error}=await sb.auth.signInWithPassword({email:d.get("email"),password:d.get("password")});if(error){toast(error.message);return}adminSession=data.session;await refreshAdminState();renderAdminPanel();toast("Signed in")};return}root.innerHTML='<div class="notice">Signed in. '+(adminReady?'<b>Authenticator verified. Admin controls unlocked.</b>':'Admin controls locked until authenticator verification.')+'</div><div class="controls" style="margin-top:12px"><button class="btn" id="enrolTotp">Set up authenticator app</button><button class="btn" id="verifyTotp">Verify 6-digit code</button><button class="btn subtle" id="adminSignout">Sign out</button></div><div id="totpSetup" style="margin-top:12px"></div><form id="totpVerify" class="controls hidden" style="margin-top:12px"><input class="field" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit code" required><button class="btn primary">Verify code</button></form>';document.getElementById("enrolTotp").onclick=async()=>{const {data,error}=await sb.auth.mfa.enroll({factorType:"totp",friendlyName:"Lording the Roster admin"});if(error){toast(error.message);return}totpFactorId=data.id;const setup=document.getElementById("totpSetup");setup.innerHTML='<div class="totp-card"><p class="muted">1. Open Google Authenticator or another authenticator app and scan this code.</p><div class="qr-frame"><img id="totpQr" alt="QR code for setting up your authenticator app"></div><p class="muted qr-fallback" id="qrFallback">If the code will not scan, add the account using the setup key below.</p><div class="secret-wrap"><span>Manual setup key</span><code id="totpSecret"></code><button type="button" class="smallbtn" id="copyTotpSecret">Copy key</button></div><p class="muted">2. Enter the six-digit code from your app to finish setup.</p></div>';const qr=document.getElementById("totpQr");if(data.totp.qr_code){qr.src=data.totp.qr_code;qr.onerror=()=>{qr.style.display="none";document.getElementById("qrFallback").textContent="The QR image could not be displayed. Use the manual setup key below instead."}}else{qr.style.display="none";document.getElementById("qrFallback").textContent="A QR image was not provided. Use the manual setup key below instead."}document.getElementById("totpSecret").textContent=data.totp.secret;document.getElementById("copyTotpSecret").onclick=()=>{navigator.clipboard?.writeText(data.totp.secret).then(()=>toast("Setup key copied")).catch(()=>toast("Select and copy the setup key manually"))};document.getElementById("totpVerify").classList.remove("hidden")};document.getElementById("verifyTotp").onclick=()=>document.getElementById("totpVerify").classList.remove("hidden");document.getElementById("totpVerify").onsubmit=async e=>{e.preventDefault();const code=new FormData(e.currentTarget).get("code");if(!totpFactorId){const {data,error}=await sb.auth.mfa.listFactors();if(error){toast(error.message);return}const factor=data.totp.find(x=>x.status==="verified");if(!factor){toast("Set up an authenticator first");return}totpFactorId=factor.id}const {data:ch,error:ce}=await sb.auth.mfa.challenge({factorId:totpFactorId});if(ce){toast(ce.message);return}const {error}=await sb.auth.mfa.verify({factorId:totpFactorId,challengeId:ch.id,code});if(error){toast(error.message);return}const {data:sess}=await sb.auth.getSession();adminSession=sess.session;await refreshAdminState();await loadSharedHeroes();renderAdminPanel();render();toast(adminReady?"Authenticator verified. Admin unlocked.":"Verification incomplete")};document.getElementById("adminSignout").onclick=async()=>{await sb.auth.signOut();adminSession=null;adminReady=false;renderAdminPanel();render();toast("Signed out")}}

async function apiInsert(item){const r=await fetch(state.config.url+"/rest/v1/suggestions",{method:"POST",headers:headers(),body:JSON.stringify({hero:item.hero,display_name:item.name,reason:item.reason,status:"approved"})});if(!r.ok)throw Error(await r.text())}
async function getSuggestions(){if(state.config.url&&state.config.key){try{return await apiGet()}catch(e){console.warn(e);return state.suggestions}}return state.suggestions}
async function wireVotes(){const list=document.getElementById("suggestions");if(!list)return;const items=await getSuggestions();if(!document.getElementById("suggestions"))return;if(!items.length){list.innerHTML='<div class="empty">No suggestions yet. Be the first to pick a challenge.</div>';return}list.innerHTML=items.sort((a,b)=>(b.votes||0)-(a.votes||0)).map((s,i)=>{const voted=localStorage.getItem("ltr-vote-"+(s.id||s.hero));return `<article class="suggestion"><div><div class="eyebrow">#${i+1} · ${esc(s.status||"Community pick")}</div><h4>${esc(s.hero)}</h4><div class="muted" style="font-size:12px">${esc(s.reason||"Suggested by "+(s.display_name||s.name||"Anonymous"))}</div></div><div class="vote"><strong>${s.votes||0}</strong><button class="${voted?"voted":""}" data-vote="${esc(s.id||s.hero)}" data-hero="${esc(s.hero)}">${voted?"Voted ✓":"▲ Vote"}</button></div></article>`}).join("");list.querySelectorAll("[data-vote]").forEach(b=>b.onclick=()=>vote(b.dataset.vote,b.dataset.hero))}
async function vote(id,hero){const key="ltr-vote-"+id;if(localStorage.getItem(key)){toast("You've already voted for this suggestion");return}if(state.config.url&&state.config.key){try{const r=await fetch(state.config.url+"/rest/v1/rpc/cast_suggestion_vote",{method:"POST",headers:headers(),body:JSON.stringify({p_suggestion_id:id,p_voter_id:voteId})});if(!r.ok)throw Error(await r.text());const accepted=await r.json();if(!accepted){toast("You've already voted for this suggestion");return}localStorage.setItem(key,"1");toast("Vote counted");wireVotes();loadTop();return}catch(e){toast("Vote failed: "+e.message);return}}const item=state.suggestions.find(s=>(s.id||s.hero)===id);if(item){item.votes=(item.votes||0)+1;localStorage.setItem(key,"1");save();wireVotes();loadTop()}}
async function loadTop(){const root=document.getElementById("topvote");if(!root)return;const items=await getSuggestions();const top=items.sort((a,b)=>(b.votes||0)-(a.votes||0))[0];root.innerHTML=top?`<div class="current"><div><h4>${esc(top.hero)}</h4><div class="muted">${top.votes||0} community votes</div></div><span class="pill live">Top pick</span></div>`:'<div class="muted">No community picks yet. Add the first one.</div>'}
render();
if(state.config.url&&state.config.key)initSupabase().then(()=>{render();}).catch(e=>console.warn("Community services unavailable:",e.message));
</script></body></html>
